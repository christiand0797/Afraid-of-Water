<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afraid of Water</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #game-container { position: relative; width: 100vw; height: 100vh; max-width: 800px; max-height: 900px; background: #1e293b; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); overflow: hidden; display: flex; flex-direction: column; }
        canvas { display: block; width: 100%; height: 100%; background: linear-gradient(to bottom, #090d16, #1a2842); }
        
        /* UI Overlay Elements */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .hud-top { display: flex; justify-content: space-between; align-items: flex-start; font-size: 1.25rem; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .hud-stats { background: rgba(15, 23, 42, 0.75); padding: 10px 18px; border-radius: 12px; backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.1); display: flex; gap: 20px; }
        
        /* Screens */
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; padding: 20px; text-align: center; }
        .screen.hidden { display: none; }
        h1 { font-size: 3rem; margin-bottom: 10px; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 2px; }
        p { color: #94a3b8; font-size: 1.1rem; margin-bottom: 25px; max-width: 450px; line-height: 1.5; }
        
        /* Buttons & Inputs */
        .btn { pointer-events: auto; cursor: pointer; background: linear-gradient(135deg, #0284c7, #2563eb); color: white; border: none; padding: 14px 32px; font-size: 1.1rem; font-weight: bold; border-radius: 12px; transition: all 0.2s ease; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4); text-transform: uppercase; letter-spacing: 1px; margin: 8px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6); filter: brightness(1.1); }
        .btn:active { transform: translateY(1px); }
        .btn-secondary { background: linear-gradient(135deg, #475569, #334155); box-shadow: 0 4px 14px rgba(71, 85, 105, 0.4); }
        
        .diff-select { display: flex; gap: 10px; margin-bottom: 20px; pointer-events: auto; }
        .diff-btn { background: #334155; border: 2px solid transparent; padding: 10px 20px; border-radius: 8px; color: #cbd5e1; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .diff-btn.active { border-color: #38bdf8; background: #0369a1; color: white; }

        /* Mobile Controls */
        .mobile-controls { position: absolute; bottom: 20px; left: 0; width: 100%; display: none; justify-content: space-between; padding: 0 20px; pointer-events: none; z-index: 5; }
        .mobile-group { display: flex; gap: 15px; pointer-events: auto; }
        .m-btn { width: 70px; height: 70px; background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%; color: white; font-size: 1.5rem; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        
        @media (max-width: 800px) { .mobile-controls { display: flex; } }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD Overlay -->
    <div class="ui-layer" id="hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-stats">
                <div>HEIGHT: <span id="hud-height">0</span>m</div>
                <div>LEVEL: <span id="hud-level">1</span></div>
            </div>
            <div class="hud-stats" style="color: #38bdf8;">
                <div>WATER SPEED: <span id="hud-water-speed">1.0</span>x</div>
            </div>
        </div>
    </div>

    <!-- Mobile Controls -->
    <div class="mobile-controls" id="mobile-controls">
        <div class="mobile-group">
            <button class="m-btn" id="m-left">◀</button>
            <button class="m-btn" id="m-right">▶</button>
        </div>
        <div class="mobile-group">
            <button class="m-btn" id="m-jump">▲</button>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen">
        <h1>Afraid of Water</h1>
        <p>Climb as high as you can. The water rises and accelerates aggressively based on your difficulty and height!</p>
        
        <div class="diff-select">
            <button class="diff-btn" onclick="setDifficulty('easy', event)">Easy</button>
            <button class="diff-btn active" onclick="setDifficulty('normal', event)">Normal</button>
            <button class="diff-btn" onclick="setDifficulty('hard', event)">Hard</button>
            <button class="diff-btn" onclick="setDifficulty('extreme', event)">Extreme</button>
        </div>

        <button class="btn" onclick="startGame()">Start Climbing</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="screen hidden">
        <h1>Drowned</h1>
        <p>The water caught up to you.</p>
        <div class="hud-stats" style="margin-bottom: 25px; flex-direction: column; gap: 5px;">
            <div>Final Height: <span id="final-height">0</span>m</div>
            <div>Reached Level: <span id="final-level">1</span></div>
        </div>
        <button class="btn" onclick="startGame()">Try Again</button>
        <button class="btn btn-secondary" onclick="showStartScreen()">Main Menu</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let gameState = 'START'; 
    let difficulty = 'normal';
    
    const difficulties = {
        easy:    { baseSpeed: 1.2, scaling: 0.15, jump: -11.5, gravity: 0.5 },
        normal:  { baseSpeed: 1.8, scaling: 0.30, jump: -12.0, gravity: 0.5 },
        hard:    { baseSpeed: 2.6, scaling: 0.50, jump: -12.5, gravity: 0.52 },
        extreme: { baseSpeed: 3.6, scaling: 0.80, jump: -13.0, gravity: 0.55 }
    };

    let scoreHeight = 0;
    let currentLevel = 1;
    let cameraY = 0;

    let player = {
        x: canvas.width / 2 - 15,
        y: 200,
        width: 30,
        height: 45,
        vx: 0,
        vy: 0,
        speed: 5.5,
        grounded: false
    };

    let water = {
        y: 0,
        baseSpeed: 1.5,
        currentSpeed: 1.5,
        waveTimer: 0
    };

    let platforms = [];
    let keys = { left: false, right: false, jump: false };

    window.addEventListener('keydown', e => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
        if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') {
            if (!keys.jump && player.grounded) {
                player.vy = difficulties[difficulty].jump;
                player.grounded = false;
            }
            keys.jump = true;
        }
    });

    window.addEventListener('keyup', e => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
        if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') keys.jump = false;
    });

    function bindTouch(id, keyName) {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('touchstart', (e) => { 
            e.preventDefault(); 
            keys[keyName] = true; 
            if(keyName === 'jump' && player.grounded) { 
                player.vy = difficulties[difficulty].jump; 
                player.grounded = false; 
            } 
        });
        el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
    }
    bindTouch('m-left', 'left');
    bindTouch('m-right', 'right');
    bindTouch('m-jump', 'jump');

    window.setDifficulty = function(diff, event) {
        difficulty = diff;
        document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
        if (event && event.target) {
            event.target.classList.add('active');
        }
    };

    window.startGame = function() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('gameover-screen').classList.add('hidden');
        document.getElementById('hud').style.display = 'flex';

        gameState = 'PLAYING';
        scoreHeight = 0;
        currentLevel = 1;
        
        player.x = canvas.width / 2 - 15;
        player.y = canvas.height - 180;
        player.vx = 0;
        player.vy = 0;

        water.y = canvas.height + 100;
        water.baseSpeed = difficulties[difficulty].baseSpeed;

        platforms = [];
        platforms.push({ x: canvas.width / 2 - 90, y: canvas.height - 100, width: 180, height: 20 });
        
        let genY = canvas.height - 220;
        while (genY > -3000) {
            generatePlatformRow(genY);
            genY -= 110 + Math.random() * 45;
        }
    };

    function generatePlatformRow(y) {
        const width = 90 + Math.random() * 70;
        const x = Math.random() * (canvas.width - width);
        platforms.push({ x, y, width, height: 18 });
    }

    window.showStartScreen = function() {
        document.getElementById('gameover-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
        document.getElementById('hud').style.display = 'none';
        gameState = 'START';
    };

    function gameOver() {
        gameState = 'GAMEOVER';
        document.getElementById('hud').style.display = 'none';
        document.getElementById('final-height').innerText = Math.floor(scoreHeight);
        document.getElementById('final-level').innerText = currentLevel;
        document.getElementById('gameover-screen').classList.remove('hidden');
    }

    function update() {
        if (gameState !== 'PLAYING') return;

        const diffSettings = difficulties[difficulty];

        scoreHeight = Math.max(scoreHeight, Math.floor((canvas.height - player.y - 180) / 10));
        currentLevel = Math.floor(scoreHeight / 40) + 1;

        // Exponential level water speed scaling
        let levelMultiplier = 1 + (Math.pow(currentLevel, 1.15) * diffSettings.scaling);
        water.currentSpeed = water.baseSpeed * levelMultiplier;

        water.waveTimer += 0.03;
        let surge = Math.sin(water.waveTimer) * (currentLevel * 0.5);
        water.y -= (water.currentSpeed + Math.max(0, surge));

        if (keys.left) player.vx = -player.speed;
        else if (keys.right) player.vx = player.speed;
        else player.vx *= 0.75;

        player.x += player.vx;

        if (player.x < 0) player.x = 0;
        if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

        player.vy += diffSettings.gravity;
        player.y += player.vy;

        let targetCameraY = player.y - canvas.height / 2.5;
        cameraY += (targetCameraY - cameraY) * 0.12;

        player.grounded = false;
        if (player.vy > 0) {
            for (let p of platforms) {
                if (
                    player.x + player.width > p.x &&
                    player.x < p.x + p.width &&
                    player.y + player.height >= p.y &&
                    player.y + player.height - player.vy <= p.y + 10
                ) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.grounded = true;
                }
            }
        }

        let highestPlatformY = platforms.reduce((min, p) => p.y < min ? p.y : min, canvas.height);
        if (highestPlatformY > cameraY - 400) {
            generatePlatformRow(highestPlatformY - (110 + Math.random() * 45));
        }

        platforms = platforms.filter(p => p.y < cameraY + canvas.height + 200);

        if (player.y + player.height >= water.y) {
            gameOver();
        }

        document.getElementById('hud-height').innerText = Math.floor(scoreHeight);
        document.getElementById('hud-level').innerText = currentLevel;
        document.getElementById('hud-water-speed').innerText = water.currentSpeed.toFixed(1);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(0, -cameraY);

        for (let p of platforms) {
            ctx.fillStyle = '#334155';
            ctx.fillRect(p.x, p.y, p.width, p.height);
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(p.x, p.y, p.width, 4);
        }

        ctx.fillStyle = '#f43f5e';
        ctx.fillRect(player.x, player.y, player.width, player.height);
        
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(player.x + (player.vx >= 0 ? 18 : 6), player.y + 8, 6, 6);

        ctx.restore();

        let renderWaterY = water.y - cameraY;
        
        ctx.fillStyle = 'rgba(2, 132, 199, 0.88)';
        ctx.fillRect(0, renderWaterY, canvas.width, canvas.height * 2);

        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.moveTo(0, renderWaterY);
        for (let i = 0; i < canvas.width; i += 20) {
            let waveHeight = Math.sin(Date.now() * 0.006 + i * 0.05) * 8;
            ctx.lineTo(i, renderWaterY + waveHeight);
        }
        ctx.lineTo(canvas.width, renderWaterY);
        ctx.lineTo(canvas.width, renderWaterY + 25);
        ctx.lineTo(0, renderWaterY + 25);
        ctx.fill();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
